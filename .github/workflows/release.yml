name: release

# Tag-triggered release: self-contained publish → Inno Setup installer →
# GitHub Release → winget manifests (and an optional, secret-gated
# submission to microsoft/winget-pkgs). See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          # The assembly Version must be plain numeric, so strip any pre-release
          # suffix (0.3.0-rc1 -> 0.3.0). The full version still names the
          # installer, release, and manifest.
          $app = ($v -split '[-+]')[0]
          "version=$v" >> $env:GITHUB_OUTPUT
          "appversion=$app" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish native/Nugsdotnet.Native/Nugsdotnet.Native.csproj -c Release
          -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.ver.outputs.appversion }}
          -o ${{ github.workspace }}\publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.ver.outputs.version }}
          "/DPublishDir=${{ github.workspace }}\publish"
          packaging\installer.iss

      - name: Sign installer (Azure Trusted Signing when configured)
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $installer = "packaging/Output/nugsdotnet-${{ steps.ver.outputs.version }}-x64-setup.exe"
          if ([string]::IsNullOrEmpty($env:AZURE_CLIENT_ID)) {
            Write-Host "Signing skipped — set AZURE_* secrets to enable Azure Trusted Signing."
            exit 0
          }
          Write-Host "Azure Trusted Signing secrets present — add azure/trusted-signing-action here."
          Write-Host "See docs/RELEASING.md for the full signing step."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/Output/nugsdotnet-${{ steps.ver.outputs.version }}-x64-setup.exe
          generate_release_notes: true

      - name: Generate winget manifests from template (always)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $installer = "packaging/Output/nugsdotnet-$ver-x64-setup.exe"
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash
          $url = "https://github.com/tsvb/nugsdotnet/releases/download/${{ github.ref_name }}/nugsdotnet-$ver-x64-setup.exe"
          $outDir = "$env:RUNNER_TEMP\winget-out"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          # Fill the checked-in template with this release's version, URL, and SHA256.
          Get-ChildItem packaging/winget/*.yaml | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text -replace 'PackageVersion: .*', "PackageVersion: $ver"
            $text = $text -replace 'InstallerUrl: .*', "InstallerUrl: $url"
            $text = $text -replace 'InstallerSha256: .*', "InstallerSha256: $sha"
            Set-Content -Path (Join-Path $outDir $_.Name) -Value $text -NoNewline
          }
          Compress-Archive -Path "$outDir\*" -DestinationPath "$env:RUNNER_TEMP\nugsdotnet-$ver-winget-manifests.zip"

      - name: Attach manifests to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} "$env:RUNNER_TEMP\nugsdotnet-${{ steps.ver.outputs.version }}-winget-manifests.zip"

      - name: Check for winget submission token
        id: tok
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) { "present=false" >> $env:GITHUB_OUTPUT }
          else { "present=true" >> $env:GITHUB_OUTPUT }

      - name: Submit to winget-pkgs (only when token present)
        if: steps.tok.outputs.present == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # Submit the COMPLETE manifests the previous step generated to
          # $RUNNER_TEMP\winget-out (real version/URL/SHA + curated License,
          # Description, Tags) — not a freshly auto-detected one. wingetcreate
          # forks microsoft/winget-pkgs via the token and opens the PR.
          # https://aka.ms/wingetcreate/latest is Microsoft's stable download alias.
          $dir = "$env:RUNNER_TEMP\winget-out"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"
          & "$env:RUNNER_TEMP\wingetcreate.exe" submit --token $env:WINGET_TOKEN $dir
